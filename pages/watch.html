<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Watch- EduTube</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="bg-gray-50 text-gray-900">
    
    <!--Main Content-->
    <main class="max-w-7xl mx-auto px-4 py-8">

      <!--Video Section-->
      <section class="mb-8">

        <div class="bg-black rounded-xl overflow-hidden aspect-video flex items-center justify-center">
          <div class="text-white text-center">
            <div class="text-5xl mb-3">
              ▶️
            </div>
            <p class="text-lg font-semibold">
              Video Player
            </p>
          </div>
        </div>

        <div class="mt-5">
          <h1 class="text-3xl font-bold mb-3">
            Introduction to HTML & CSS
          </h1>
          <div class="flex flex-wrap items-center gap-4 text-sm text-gray-500 mb-4">
            <span>👨‍🏫 EduTube Instructor</span>
            <span>⏱️ 2h 10m</span>
            <span>⭐ 4.5</span>
          </div>
          <p class="text-gray-600">
            Learn the fundamentals of HTML and CSS and build the foundation you need for modern web development.
          </p>
        </div>
      </section>

      <!--Notes Section-->
      <section class="bg-white rounded-xl shadow-sm p-6">

        <div class="flex items-center justify-between mb-5">
          <h2 class="text-2xl font-bold">
            My Notes
          </h2>
          <button id="addNoteButton" type="button" class="bg-indigo-600 text-white font-semibold px-4 py-2 rounded-lg hover:bg-indigo-700">
            + Add Note
          </button>
        </div>

        <!--Notes Container-->
        <div id="notesContainer" class="space-y-4">
          <p id="noNotes" class="text-gray-500">
            No notes added yet.
          </p>
        </div>
      </section>
    </main>

    <script src="../js/watch.js"></script>
  </body>
</html>
